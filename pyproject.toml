[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-forecast-lk"
version = "1.0.0"
description = "One-week-ahead dengue case forecasting for Sri Lankan RDHS divisions (Applied Machine Learning assignment)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
